name: Render Yokohama Noir Video

on:
  workflow_dispatch: # Позволяет запускать рендер вручную по кнопке
  push:
name: Render Yokohama Noir Video

on:
  workflow_dispatch:

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Установка системных утилит, FFmpeg и шрифтов
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core fonts-freefont-ttf libgbm1 libnss3 libasound2t64 || sudo apt-get install -y libasound2

      - name: 4. Установка зависимостей проекта
        run: npm install

      - name: 5. Запуск рендера
        run: node render.mjs

      - name: 6. Выгрузка готового видео
        uses: actions/upload-artifact@v4
        with:
          name: yokohama-noir-masterpiece-video
          path: yokohama_noir_masterpiece.mp4
          retention-days: 7

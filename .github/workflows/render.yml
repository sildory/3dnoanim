name: Render Yokohama Noir Video

on:
  workflow_dispatch:

# Разрешаем создавать релизы и прикреплять к ним видео
permissions:
  contents: write

jobs:
  render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Установка системных утилит, FFmpeg и шрифтов
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core fonts-freefont-ttf libgbm1 libnss3 libasound2t64 || sudo apt-get install -y libasound2

      - name: 4. Установка зависимостей проекта
        run: npm install

      - name: 5. Запуск рендера
        run: node render.mjs

      - name: 6. Публикация готового видео в GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="render-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" yokohama_noir_masterpiece.mp4 \
            --title "Yokohama Noir ($TAG)" \
            --notes "Готовый 60 FPS рендер (1080p H.264)"

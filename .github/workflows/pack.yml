name: Pack Code

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Упаковка кодовой базы через Repomix
        run: |
          npx --yes repomix --output repomix-output.txt --ignore "node_modules/**,*.mp4"

      - name: 4. Публикация чистого текстового файла в Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="code-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" repomix-output.txt \
            --title "Code Snapshot ($TAG)" \
            --notes "Полный исходный код проекта в одном распакованном файле repomix-output.txt"
